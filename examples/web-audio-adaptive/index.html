<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoundMCP adaptive music</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.6 system-ui, sans-serif; }
    body { box-sizing: border-box; max-width: 38rem; margin: 12vh auto 0; padding: 0 1.5rem; }
    h1 { line-height: 1.2; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; }
    button { font: inherit; padding: .4rem .8rem; }
    label { display: flex; align-items: center; gap: .75rem; margin: 1.4rem 0; }
  </style>
</head>
<body>
  <h1>Adaptive music</h1>
  <div class="controls">
    <button id="play">Play</button>
    <button id="exit" disabled>Exit at a loop boundary</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <label>Music volume <input id="volume" type="range" min="0" max="1" value=".75" step=".01"></label>
  <p id="status" role="status">Ready to load the music.</p>
  <script type="module">
    import { AdaptiveMusicPlayer, loadAdaptivePack } from './player.mjs';

    const status = document.querySelector('#status');
    const play = document.querySelector('#play');
    const exit = document.querySelector('#exit');
    const stop = document.querySelector('#stop');
    const volume = document.querySelector('#volume');
    let context;
    let player;
    let update;

    function refresh() {
      const session = player?.session;
      play.disabled = Boolean(session);
      exit.disabled = !session || Boolean(session.outro);
      stop.disabled = !session;
      if (!session) {
        status.textContent = 'Playback ended.';
        return;
      }
      const now = context.currentTime;
      status.textContent = now < session.loopAt ? 'Intro'
        : now >= session.exitAt ? 'Outro'
        : session.outro ? 'Outro queued for the next loop boundary' : 'Loop';
      update = requestAnimationFrame(refresh);
    }

    play.addEventListener('click', async () => {
      play.disabled = true;
      status.textContent = 'Loading the intro, loop, and outro…';
      try {
        context ??= new AudioContext({ sampleRate: 48000 });
        await context.resume();
        player ??= new AdaptiveMusicPlayer(context, await loadAdaptivePack(context, '/pack/manifest.json'));
        player.setVolume(volume.valueAsNumber);
        player.play();
        refresh();
      } catch (error) {
        play.disabled = false;
        status.textContent = error.message;
      }
    });
    exit.addEventListener('click', () => player.exitAfterLoop());
    stop.addEventListener('click', () => {
      cancelAnimationFrame(update);
      player.stop();
      refresh();
    });
    volume.addEventListener('input', () => player?.setVolume(volume.valueAsNumber));
  </script>
</body>
</html>
